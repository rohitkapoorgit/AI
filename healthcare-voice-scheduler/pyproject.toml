[project]
name = "healthcare-voice-scheduler"
version = "0.1.0"
description = "Production-grade healthcare voice AI that helps patients schedule appointments over a real phone call."
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[webrtc,deepgram,cartesia,anthropic,silero]",
    "pipecat-ai-prebuilt",
    "fastapi",
    "uvicorn[standard]",
    "anthropic",
    "httpx",
    "fhirpy",
    "pydantic-settings",
    "python-dotenv",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent"]
