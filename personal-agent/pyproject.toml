[project]
name = "personal-agent"
version = "0.1.0"
description = "Personal morning digest — a multi-agent system (orchestrator + sub-agents) for daily weather, transit, email, and school info."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "httpx",
    "python-dotenv",
    "mcp",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_agent"]
